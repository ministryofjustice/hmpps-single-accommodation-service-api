name: Run

on:
  workflow_call:
    inputs:
      app_version:
        description: |
          App version used for the Docker image tag / Helm deploy.
          Not used for Pact Broker lookups - those always use github.sha,
          matching the version published during provider verification.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  trigger_pact_provider_verification:
    name: Trigger Pact Provider Verification
    runs-on: ubuntu-latest
    steps:
      - name: Obtain Octo STS Token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05
        id: octo_sts
        with:
          scope: ministryofjustice/hmpps-person-record
          identity: moj-hmpps-single-accommodation-service-api
      - name: Checkout Person Record repository
        id: checkout-person-record
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ministryofjustice/hmpps-person-record
          token: ${{ steps.octo_sts.outputs.token }}
          path: hmpps-person-record
          ref: feat/octo-sts-setup-for-contract-test-trigger
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Run Pact Provider Verification
        working-directory: hmpps-person-record
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_CONSUMER_NAME: hmpps-single-accommodation-service-api
          PACT_CONSUMER_BRANCH: ${{ github.ref_name }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          PACT_PUBLISH_RESULTS: 'true'
          PACT_PROVIDER_APP_VERSION: ${{ inputs.app_version }}
        run: |
          chmod +x gradlew
          ./gradlew pactTest
