name: Run

on:
  workflow_call:
    inputs:
      app_version:
        description: |
          App version used for the Docker image tag / Helm deploy.
          Not used for Pact Broker lookups - those always use github.sha,
          matching the version published during provider verification.
        required: true
        type: string

permissions:
  contents: read

jobs:
  trigger_pact_provider_verification:
    name: Trigger Pact Provider Verification
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          app-id: ${{ secrets.PACT_TRIGGER_APP_ID }}
          private-key: ${{ secrets.PACT_TRIGGER_PRIVATE_KEY }}
          owner: ministryofjustice
          permission-actions: write
          repositories: hmpps-person-record

      - name: Trigger external Pact provider verification workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONSUMER_NAME: ${{ github.event.repository.name }}
          CONSUMER_BRANCH: ${{ github.ref_name }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'ministryofjustice',
              repo: 'hmpps-person-record',
              workflow_id: 'pact_provider_verification.yml',
              ref: 'main',
              inputs: {
                consumerName: process.env.CONSUMER_NAME,
                consumerBranch: process.env.CONSUMER_BRANCH,
                publishResults: 'true',
              }
            })