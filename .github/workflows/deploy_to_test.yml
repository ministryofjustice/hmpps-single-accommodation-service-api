name: Deploy to test

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker_build:
    name: Build docker image from hmpps-github-actions
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2 # WORKFLOW_VERSION
    with:
      docker_registry: 'ghcr.io'
      registry_org: 'ministryofjustice'
      push: true
      docker_multiplatform: false
      tag_latest: false

  can_i_deploy:
    name: Can I deploy hmpps-single-accommodation-service-api to Test
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/pact_can_i_deploy.yml@v2 # WORKFLOW_VERSION
    with:
      pacticipant: hmpps-single-accommodation-service-api
      version: ${{ github.sha }}
      to_environment: Test
    secrets:
      PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
      HMPPS_PACT_BROKER_USERNAME: ${{ secrets.HMPPS_PACT_BROKER_USERNAME }}
      HMPPS_PACT_BROKER_PASSWORD: ${{ secrets.HMPPS_PACT_BROKER_PASSWORD }}

  deploy_test:
    name: Deploy to the test environment
    needs:
      - docker_build
      - can_i_deploy
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'test'
      app_version: '${{ needs.docker_build.outputs.app_version }}'

  record_deployment:
    name: Record Pact Broker deployment
    needs:
      - deploy_test
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/pact_record_deployment.yml@v2 # WORKFLOW_VERSION
    with:
      app_version: '${{ needs.docker_build.outputs.app_version }}'
      environment: 'test'
      pacticipant: hmpps-single-accommodation-service-api
      pacticipant_version: ${{ github.sha }}
    secrets:
      PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
      HMPPS_PACT_BROKER_USERNAME: ${{ secrets.HMPPS_PACT_BROKER_USERNAME }}
      HMPPS_PACT_BROKER_PASSWORD: ${{ secrets.HMPPS_PACT_BROKER_PASSWORD }}
