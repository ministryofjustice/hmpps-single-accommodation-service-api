<script>
  function statusCardTag(outcome) {
    const meta = data.statuses[outcome.status];
    if (!meta) return esc(outcome.status);
    const status = outcome.status.slice(meta.service.length + 1);
    const grey = ['NOT_REQUIRED', 'NOT_ELIGIBLE', 'UNKNOWN', 'NOT_ACCEPTED', 'BOOKING_CANCELLED'];
    const green = ['ARRIVED', 'PLACEMENT_BOOKED', 'BOOKING_CONFIRMED', 'ACCEPTED', 'AWAITING_ARRIVAL', 'COMPLETED'];
    const yellow = ['SUBMITTED', 'PLACEMENT_REQUEST_SUBMITTED', 'AWAITING_DECISION', 'ON_WAITING_LIST', 'PLACE_OFFERED', 'OFFER_ACCEPTED'];
    const colour = status.startsWith('CANNOT_START_YET') || grey.includes(status) ? 'grey' :
      meta.upcoming || yellow.includes(status) ? 'yellow' : green.includes(status) ? 'green' : 'orange';
    const text = meta.text.charAt(0) + meta.text.slice(1).toLowerCase();
    return '<strong class="govuk-tag govuk-tag--' + colour + '">' + esc(text) + '</strong>';
  }

  function statusActionPreview(outcome) {
    const meta = data.statuses[outcome.status];
    const actions = {
      ADD_AND_CONFIRM_PROPOSED_ADDRESS: 'Add and confirm proposed address',
      ADD_DTR_OUTCOME: 'Add DTR referral outcome',
      ADD_DTR_REFERRAL_DETAILS: 'Add DTR referral details',
      CONTINUE_APPROVED_PREMISE_APPLICATION: 'Continue an approved premises (CAS1) application',
      START_CAS2_REFERRAL: 'Start a CAS2 referral',
      CONTINUE_A_CAS2_REFERRAL: 'Continue a CAS2 referral',
      PROVIDE_MORE_INFORMATION_FOR_CAS2_REFERRAL: 'Provide more information for the CAS2 referral',
      REPLY_TO_CAS2_PLACE_OFFER: 'Reply to CAS2 place offer',
      CREATE_PLACEMENT: 'Create an approved premises (CAS1) placement request',
      PROVIDE_INFORMATION: 'Provide further information on an approved premises (CAS1) application',
      REPLY_TO_CAS3_BEDSPACE_OFFER: 'Reply to CAS3 bedspace offer',
      START_APPROVED_PREMISE_APPLICATION: 'Start an approved premises (CAS1) application',
      START_CAS3_REFERRAL: 'Start a CAS3 referral',
      CONTINUE_CAS3_REFERRAL: 'Continue CAS3 referral',
      SUBMIT_CRS_ACCOMMODATION_REFERRAL: 'Submit a CRS accommodation referral',
      SUBMIT_CRS_REFERRAL: 'Submit a CRS referral',
      SUBMIT_DTR_REFERRAL: 'Submit a DTR referral'
    };
    if (meta?.actionType && !actions[meta.actionType]) throw new Error('Missing UI action label: ' + meta.actionType);
    const text = meta?.actionType ? actions[meta.actionType] + (meta.upcoming ? ' in 14 days' : '') : 'None';
    return '<p class="card-action"><b>Action:</b> ' + esc(text) + '</p>';
  }

  function statusCardPreview(outcome, failureReasons) {
    const meta = data.statuses[outcome.status];
    if (!meta) return '<p>Card preview unavailable for status ' + esc(outcome.status) + '.</p>';
    const service = meta.service;
    if (service === 'PA') {
      return '<p>Proposed address: <b>' + esc(meta.text) + '</b>. The UI has no corresponding eligibility card.</p>';
    }
    const status = outcome.status.slice(service.length + 1);
    const reasons = [...new Set([...(outcome.failureReasons || []), ...failureReasons])];
    if (service === 'CAS1' && status === 'NOT_ELIGIBLE' && reasons.includes('NOT_IN_PRISON_OR_CAS1_ACCOMMODATION')) {
      return '<p class="muted">The UI hides the CAS1 card when person is not in prison or CAS1 accommodation.</p>';
    }
    const headings = {
      CAS1: 'Approved premises (CAS1)', CAS2: 'Short-term accommodation (CAS2)',
      CAS3: 'CAS3 (transitional accommodation)', DTR: 'Duty to Refer (DTR)',
      CRS: 'Commissioned Rehabilitative Services (CRS)'
    };
    const inactive = status === 'NOT_ELIGIBLE' || (['CRS', 'DTR'].includes(service) && status === 'NOT_REQUIRED');
    let hint = meta.upcoming ? 'Start referral from 18 November 2026 (in 14 days).' : '';
    let content = '';
    if (service === 'CAS1' && status === 'NOT_ELIGIBLE' &&
      reasons.some(r => ['MALE_NOT_HIGH_RISK_TIER', 'NON_MALE_NOT_HIGH_RISK_TIER'].includes(r))) {
      hint = 'Tier not eligible for this level of supervision.';
    }
    if (service === 'CAS2' && status === 'NOT_ELIGIBLE') {
      const summaries = {
        INVALID_TIER: 'Tier not eligible', UNDER_18: 'Age (applicant is under 18)',
        SEXUAL_OFFENCE_REGISTRATIONS_PRESENT: 'Sexual offence history'
      };
      if (reasons.length >= 2) {
        const bullets = reasons.map(r => summaries[r]).filter(Boolean);
        if (bullets.length) content = '<p>Not eligible due to:</p><ul>' + bullets.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>';
      } else {
        const messages = {
          INVALID_TIER: 'Tier not eligible.',
          SEXUAL_OFFENCE_REGISTRATIONS_PRESENT: 'Not eligible due to sexual offence history.',
          UNDER_18: 'Not eligible as applicant is under 18.',
          IN_CAS3_ACCOMMODATION: 'Not eligible as applicant is currently in a CAS3 property.',
          IN_PRISON_NO_RELEASE_DATE: 'Must have a conditional release date to start application.'
        };
        content = reasons.map(r => messages[r]).filter(Boolean).map(t => '<p>' + esc(t) + '</p>').join('');
      }
    }
    if (service === 'CAS3') {
      if (status === 'NOT_ELIGIBLE') hint = reasons.includes('INVALID_CURRENT_ACCOMMODATION_TYPE') ?
        'Only for prison leavers, move on from Approved premises or CAS2.' : 'Not at risk of homelessness.';
      if (status === 'BEDSPACE_OFFERED') hint = 'Bedspace details are sent by email';
      const requirements = {
        SUBMIT_CRS_BEFORE_CAS3: ['submit a CRS referral'],
        SUBMIT_DTR_BEFORE_CAS3: ['add DTR referral details'],
        SUBMIT_DTR_AND_CRS_BEFORE_CAS3: ['Add DTR referral details', 'Submit a CRS referral'],
        SUBMIT_CRS_ACCOMMODATION_BEFORE_CAS3: ['submit a CRS accommodation referral'],
        SUBMIT_DTR_AND_CRS_ACCOMMODATION_BEFORE_CAS3: ['Add DTR referral details', 'Submit a CRS accommodation referral']
      }[outcome.blockingReason];
      if (requirements) content = requirements.length === 1 ?
        '<p>You need to ' + esc(requirements[0]) + ' before you can make a CAS3 referral.</p>' :
        '<p>Before you can make a CAS3 referral, you need to:</p><ul>' + requirements.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>';
    }
    if (service === 'CRS') {
      if (status === 'NOT_ELIGIBLE') hint = 'No referral needed for accommodation.\nYou can still complete a CRS for other requirements.';
      if (status.startsWith('NOT_STARTED')) hint = 'No open CRS accommodation referral.';
    }
    const rows = exampleCardDetails(service, status);
    const details = rows.length ? '<dl class="sas-card-summary-list govuk-summary-list--no-border">' +
      rows.map(row => '<div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">' +
        esc(row[0]) + '</dt><dd class="govuk-summary-list__value">' + esc(row[1]) + '</dd></div>').join('') + '</dl>' : '';
    let linkText = meta.linkText;
    if (service === 'CAS2' && status === 'MORE_INFORMATION_NEEDED') linkText = 'Continue application';
    if (service === 'CRS') linkText = status.startsWith('NOT_STARTED') ? 'Start referral' : status === 'SUBMITTED' ? 'View referral' : null;
    if (service === 'DTR') linkText = status === 'NOT_STARTED' ? 'Add referral details' :
      ['SUBMITTED', 'ACCEPTED', 'NOT_ACCEPTED'].includes(status) ? 'View referral' : null;
    const links = linkText ? '<div class="sas-card__links"><a role="link" aria-disabled="true" title="Example link only">' + esc(linkText) + '</a></div>' : '';
    return '<article class="sas-card' + (inactive ? ' sas-card--inactive' : status.startsWith('CANNOT_START_YET') ? ' sas-card--blocked' : '') +
      '" data-preview-status="' + esc(outcome.status) + '"><header class="sas-card__head"><h3 class="govuk-heading-m">' +
      esc(headings[service]) + '</h3>' + statusCardTag(outcome) +
      '</header><div class="sas-card__footer"><div class="sas-card__content">' +
      (hint ? '<p class="sas-card__hint">' + esc(hint) + '</p>' : '') + details + content + '</div>' + links + '</div></article>';
  }

  function exampleCardDetails(service, status) {
    const submitted = ['Submitted', '2 November 2026 (2 days ago)'];
    const submittedBy = ['Submitted by', 'Example practitioner'];
    const requestSubmitted = ['Request submitted', '2 November 2026 (2 days ago)'];
    const requestBy = ['Request submitted by', 'Example practitioner'];
    const expires = ['Application expires', '2 May 2027'];
    const arrival = ['Expected arrival', '18 November 2026 (in 14 days)'];
    if (service === 'CAS1') {
      switch (status) {
        case 'NOT_SUBMITTED':
          return [['Application started', '1 November 2026 (3 days ago)'], ['Started by', 'Example practitioner']];
        case 'SUBMITTED':
        case 'INFO_REQUESTED':
          return [submitted, submittedBy];
        case 'APPLICATION_REJECTED':
          return [['Decision', 'Reject'], submitted, submittedBy];
        case 'PLACEMENT_BOOKED':
          return [arrival, ['Duration', '12 weeks'], requestBy];
        case 'ARRIVED':
          return [['Arrival date', '2 November 2026 (2 days ago)'], ['Expected departure', '25 January 2027'], requestBy];
        case 'NOT_ARRIVED':
          return [arrival, requestBy, expires];
        case 'PLACEMENT_CANCELLED':
          return [['Cancellation reason', 'Their circumstances changed'], arrival, requestBy, expires];
        case 'PLACEMENT_REQUEST_NOT_STARTED':
        case 'PLACEMENT_REQUEST_NOT_SUBMITTED':
          return [submittedBy, expires];
        case 'PLACEMENT_REQUEST_SUBMITTED':
          return [requestSubmitted, requestBy, expires];
        case 'PLACEMENT_REQUEST_REJECTED':
          return [['Rejection reason', 'Another provision has been identified'], requestSubmitted, requestBy, expires];
        case 'PLACEMENT_REQUEST_WITHDRAWN':
          return [['Withdrawal reason', 'Their circumstances changed'], requestSubmitted, requestBy, expires];
        default:
          return [];
      }
    }
    if (service === 'CAS2') {
      switch (status) {
        case 'NOT_SUBMITTED':
          return [['Application started', '1 November 2026 (3 days ago)'], ['Started by', 'Example practitioner']];
        case 'MORE_INFORMATION_NEEDED':
        case 'SUBMITTED':
        case 'AWAITING_DECISION':
        case 'ON_WAITING_LIST':
        case 'PLACE_OFFERED':
        case 'OFFER_ACCEPTED':
        case 'AWAITING_ARRIVAL':
        case 'WITHDRAWN':
          return [submitted, submittedBy];
        case 'OFFER_DECLINED_OR_WITHDRAWN':
        case 'CANCELLED':
          return [['Reason', 'Their circumstances changed'], submitted, submittedBy];
        default:
          return [];
      }
    }
    if (service === 'CAS3') {
      const referralBy = ['Referral submitted by', 'Example practitioner'];
      switch (status) {
        case 'SUBMITTED':
          return [submitted, submittedBy];
        case 'REJECTED':
          return [['Rejection reason', 'Another provision has been identified'], submitted, submittedBy];
        case 'BEDSPACE_OFFERED':
          return [['Provisional offer sent', '3 November 2026 (1 day ago)'], referralBy];
        case 'BOOKING_CONFIRMED':
          return [['Address', '1 Example Road, Example Town, AB1 2CD'], ['Booking dates', '18 November 2026 to 10 February 2027 (12 weeks)'], referralBy];
        case 'BOOKING_CANCELLED':
          return [['Cancellation reason', 'Their circumstances changed'], ['Booking dates', '18 November 2026 to 10 February 2027'], referralBy];
        case 'ARRIVED':
          return [['Arrival date', '2 November 2026 (2 days ago)'], ['Expected departure date', '25 January 2027'], referralBy];
        default:
          return [];
      }
    }
    if (service === 'DTR' && ['SUBMITTED', 'ACCEPTED', 'NOT_ACCEPTED'].includes(status)) {
      return [['Submitted to', 'Example Council'], ['Reference', 'EXAMPLE-123'], submitted, submittedBy];
    }
    if (service === 'CRS' && status === 'SUBMITTED') return [submitted];
    return [];
  }
</script>
<script>
  const data = JSON.parse(document.getElementById('graph-data').textContent);
  const treeSelect = document.getElementById('tree');
  const panel = document.getElementById('panel');
  data.trees.forEach(t => treeSelect.add(new Option(t.name, t.name)));

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const codeLink = (name, path) => path ? '<a href="' + esc(path) + '" target="_blank"><code>' + esc(name) + '</code></a>' : '<code>' + esc(name) + '</code>';
  const sourceTextLink = (text, path) => path ?
    '<a href="' + esc(path) + '" target="_blank" rel="noopener noreferrer">' + esc(text) + '</a>' : esc(text);

  function label(n) {
    return n.label;
  }

  const cy = cytoscape({
    container: document.getElementById('cy'),
    wheelSensitivity: 0.3,
    style: [
      { selector: 'node', style: {
        'label': 'data(label)', 'text-wrap': 'wrap', 'text-max-width': 360, 'font-size': 12,
        'text-valign': 'center', 'text-halign': 'center', 'width': 'label', 'height': 'label', 'padding': 12,
        'shape': 'round-rectangle', 'border-width': 2, 'color': '#333' } },
      { selector: 'node[kind = "RULE_SET"]', style: { 'background-color': '#dbe9ff', 'border-color': '#3b73c4', 'text-justification': 'left' } },
      { selector: 'node[kind = "CONTEXT_UPDATER"]', style: { 'background-color': '#fff2cc', 'border-color': '#c99a00', 'font-size': 11 } },
      { selector: 'node[kind = "OUTCOME"]', style: { 'background-color': '#d9f2d9', 'border-color': '#2e8b2e' } },
      { selector: 'edge', style: {
        'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'width': 2, 'label': 'data(label)',
        'font-size': 10, 'text-background-color': '#fff', 'text-background-opacity': 1, 'text-background-padding': 2 } },
      { selector: 'edge[label = "PASS"]', style: { 'line-color': '#2e8b2e', 'target-arrow-color': '#2e8b2e', 'color': '#2e8b2e' } },
      { selector: 'edge[label = "FAIL"]', style: { 'line-color': '#c0392b', 'target-arrow-color': '#c0392b', 'color': '#c0392b' } },
      { selector: 'edge[label = "CONTINUE"]', style: { 'line-color': '#0088ff', 'target-arrow-color': '#0088ff', 'color': '#0088ff' } },
      { selector: '.faded', style: { 'opacity': 0.15 } },
      { selector: 'node:selected', style: { 'border-width': 5, 'border-color': '#000' } },
      { selector: 'node.onpath', style: { 'border-width': 6, 'border-color': '#8e44ad' } },
      { selector: 'edge.onpath', style: { 'width': 6, 'z-index': 10 } },
      { selector: 'node.sim-fail', style: { 'background-color': '#f8d7d3' } },
      { selector: 'node.sim-pass', style: { 'background-color': '#c8ecc8' } },
    ],
  });

  let currentTree;

  function runLayout() {
    cy.layout({ name: 'dagre', rankDir: 'TB', nodeSep: 40, rankSep: 70, edgeSep: 20 }).run();
    cy.fit(undefined, 30);
  }

  function showTree(name) {
    currentTree = data.trees.find(t => t.name === name);
    cy.elements().remove();
    cy.add(currentTree.nodes.map(n => ({ group: 'nodes', data: {
      id: n.id, label: label(n), title: n.title, kind: n.kind } })));
    cy.add(currentTree.edges.map((e, i) => ({ group: 'edges', data: {
      id: 'e' + i, source: e.from, target: e.to, label: e.label } })));
    runLayout();
    panel.innerHTML = '<h2>' + esc(name) + '</h2><p class="muted">' + currentTree.nodes.length + ' nodes, ' +
      currentTree.edges.length + ' edges. Click a node for details.</p>';
  }

  function updaterHtml(title, u) {
    if (!u) return '';
    const name = u.name === 'constant' ? '' : codeLink(u.name, u.sourcePath) + ' – ';
    return '<h3>' + title + ' context updater</h3><p>' + name + esc(u.description);
  }

  function showNode(id) {
    const n = currentTree.nodes.find(x => x.id === id);
    let html = '<h2>' + esc(n.title) + '</h2><p class="muted">' + esc(n.kind) + '</p>';
    if (n.kind === 'RULE_SET') {
      html += '<h3>Rules</h3>';
      html += n.rules.length === 0 ? '<p>(no rules – always PASS)</p>' :
        '<ul>' + n.rules.map(r => '<li>' + codeLink(r.className, r.sourcePath) + '<br>' + esc(r.description) + '</li>').join('') + '</ul>';
      html += updaterHtml('PASS', n.onPass) + updaterHtml('FAIL', n.onFail);
    }
    const node = cy.getElementById(id);
    const inc = node.incomers('edge').map(e => esc(e.source().data('title')) + ' <b>' + esc(e.data('label')) + '</b>');
    const out = node.outgoers('edge').map(e => '<b>' + esc(e.data('label')) + '</b> → ' + esc(e.target().data('title')));
    if (inc.length) html += '<h3>Reached from</h3><ul>' + inc.map(s => '<li>' + s + '</li>').join('') + '</ul>';
    if (out.length) html += '<h3>Leads to</h3><ul>' + out.map(s => '<li>' + s + '</li>').join('') + '</ul>';
    panel.innerHTML = html;
  }

  function highlightPathsTo(node) {
    const path = node.predecessors().union(node);
    cy.elements().addClass('faded');
    path.removeClass('faded');
  }

  function clearHighlight() {
    cy.elements().removeClass('faded onpath sim-pass sim-fail');
    cy.$(':selected').unselect();
  }

  // ---------- Simulation ----------
  // Mirrors RuleSetNode.eval / RulesEngine.execute: a RuleSet PASSes only if none of its rules FAIL,
  // then follows the PASS/FAIL edge (via its context updater, if any) until an outcome is reached.
  // Rule results are keyed by rule class, so a rule shared by several RuleSets has a single result.
  const simCheckbox = document.getElementById('simulate');
  const failing = new Set();
  let simMode = false;

  function simulate() {
    const byId = new Map(currentTree.nodes.map(n => [n.id, n]));
    const outEdges = id => currentTree.edges.filter(e => e.from === id);
    const incoming = new Set(currentTree.edges.map(e => e.to));
    const root = currentTree.nodes.find(n => !incoming.has(n.id)) || currentTree.nodes[0];
    const steps = [];
    const pathEdges = [];
    let id = root.id;
    let lastUpdater = null;
    let guard = 0;
    while (id && guard++ < 200) {
      const n = byId.get(id);
      let edge;
      if (n.kind === 'RULE_SET') {
        const failed = n.rules.filter(r => failing.has(r.className));
        const status = failed.length ? 'FAIL' : 'PASS';
        steps.push({ node: n, status: status, failed: failed });
        const updater = status === 'PASS' ? n.onPass : n.onFail;
        if (updater) lastUpdater = updater;
        edge = outEdges(id).find(e => e.label === status);
      } else if (n.kind === 'CONTEXT_UPDATER') {
        steps.push({ node: n });
        edge = outEdges(id).find(e => e.label === 'CONTINUE');
      } else {
        steps.push({ node: n });
        break;
      }
      if (!edge) break;
      pathEdges.push(edge);
      id = edge.to;
    }
    return { steps: steps, pathEdges: pathEdges, lastUpdater: lastUpdater };
  }

  function badge(status) {
    if (!status) return '<span class="badge na">not reached</span>';
    return '<span class="badge ' + status.toLowerCase() + '">' + status + '</span>';
  }

  function resultHtml(res) {
    const last = res.steps[res.steps.length - 1];
    if (!last || last.node.kind !== 'OUTCOME') return '<div class="result">No outcome reached</div>';
    const fixedStatus = data.statuses[last.node.id];
    const outcomes = fixedStatus ? [{ status: last.node.id }] : (res.lastUpdater?.outcomes || []);
    let html = '<div class="result">';
    if (!outcomes.length) return html + '<p>No status was set, so a card cannot be previewed.</p></div>';
    if (outcomes.length > 1) {
      html;
    }
    const previousRuleSet = res.steps.filter(s => s.node.kind === 'RULE_SET').pop();
    const reasons = (previousRuleSet?.failed || []).map(r => r.failureReason).filter(Boolean);
    return html + outcomes.map(o => statusCardPreview(o, reasons) + statusActionPreview(o)).join('') + '</div>';
  }

  function failureDescription(rules) {
    return 'Failed because ' + rules.map(rule => rule.description.replace(/^FAIL if\s+/i, '')).join('; ');
  }

  function traceStepHtml(step, res) {
    if (step.node.kind === 'RULE_SET') {
      if (step.failed.length) return step.failed.map(rule =>
        '<li>' + sourceTextLink(failureDescription([rule]), rule.sourcePath) + ' ' + badge('FAIL') + '</li>').join('');
      const description = 'Passed because ' + step.node.title.replace(/^PASS if\s+/i, '');
      return '<li>' + sourceTextLink(description, step.node.sourcePath) + ' ' + badge('PASS') + '</li>';
    }
    if (step.node.kind === 'CONTEXT_UPDATER') {
      const updater = res.steps.filter(s => s.node.kind === 'RULE_SET')
        .map(s => s.status === 'PASS' ? s.node.onPass : s.node.onFail)
        .find(u => u?.description === step.node.title);
      let description = esc(step.node.title);
      if (updater) {
        const statuses = [...new Map(updater.outcomes.map(o => [data.statuses[o.status]?.text, o])).entries()]
          .filter(([text]) => text).sort((a, b) => b[0].length - a[0].length);
        const labels = new Map(statuses.map(([text, outcome]) => [esc(text), statusCardTag(outcome)]));
        if (labels.size) {
          const pattern = [...labels.keys()].map(text => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
          description = description.replace(new RegExp(pattern, 'g'), match => labels.get(match));
        }
      }
      return '<li class="trace-update">' + description + ' ' + badge('UPDATE') + '</li>';
    }
    const outcomeCount = data.statuses[step.node.id] ? 1 : (res.lastUpdater?.outcomes.length || 0);
    return '<li><div class="trace-outcomes"><b>' + (outcomeCount > 1 ? 'Outcomes' : 'Outcome') + '</b>' +
      resultHtml(res) + '</div></li>';
  }

  function renderSim() {
    const res = simulate();
    const statusById = new Map(res.steps.filter(s => s.status).map(s => [s.node.id, s.status]));

    cy.elements().removeClass('faded onpath sim-pass sim-fail');
    cy.$(':selected').unselect();
    cy.elements().addClass('faded');
    res.steps.forEach(s => cy.getElementById(s.node.id).removeClass('faded').addClass('onpath'));
    res.pathEdges.forEach(e => cy.getElementById('e' + currentTree.edges.indexOf(e)).removeClass('faded').addClass('onpath'));
    statusById.forEach((status, nodeId) => cy.getElementById(nodeId).addClass(status === 'PASS' ? 'sim-pass' : 'sim-fail'));

    let html = '<div class="simulation-actions"><button data-sim="all-pass">All PASS</button>' +
      '<button data-sim="all-fail">All FAIL</button><button data-sim="copy">Copy link</button></div>' +
      '<h2>Trace</h2><ol class="trace">' +
      res.steps.map(s => traceStepHtml(s, res)).join('') + '</ol>' +
      '<h2>Rules</h2>';

    currentTree.nodes.filter(n => n.kind === 'RULE_SET').forEach(n => {
      const status = statusById.get(n.id);
      html += '<div class="sim-group ' + (status ? 'visited' : 'skipped') + '" id="sim-' + esc(n.id) + '">' +
        '<h4><span>' + sourceTextLink(n.title, n.sourcePath) + '</span>' + badge(status) + '</h4>';
      if (n.rules.length === 0) html += '<div class="muted" style="font-size:12px">(no rules – always PASS)</div>';
      n.rules.forEach(r => {
        const fail = failing.has(r.className);
        html += '<div class="sim-rule"><button class="' + (fail ? 'fail' : 'pass') + '" data-rule="' + esc(r.className) + '">' +
          (fail ? 'FAIL' : 'PASS') + '</button><span>' +
          (r.sourcePath ? '<a href="' + esc(r.sourcePath) + '" target="_blank" rel="noopener noreferrer">' +
            esc(r.description) + '</a>' : esc(r.description)) + '</span></div>';
      });
      html += '</div>';
    });
    panel.innerHTML = html;
    updateUrl();
  }

  function allRuleClasses() {
    return [...new Set(currentTree.nodes.flatMap(n => n.rules.map(r => r.className)))];
  }

  function updateUrl() {
    const params = new URLSearchParams();
    params.set('tree', currentTree.name);
    if (simMode) params.set('sim', '1');
    if (failing.size) params.set('fail', [...failing].sort().join(','));
    history.replaceState(null, '', location.pathname + '#' + params.toString());
  }

  function handleSimulationClick(evt) {
    const ruleBtn = evt.target.closest('[data-rule]');
    if (ruleBtn) {
      const rule = ruleBtn.getAttribute('data-rule');
      if (failing.has(rule)) failing.delete(rule); else failing.add(rule);
      renderSim();
      return;
    }
    const action = evt.target.closest('[data-sim]');
    if (!action) return;
    evt.preventDefault();
    const kind = action.getAttribute('data-sim');
    if (kind === 'all-pass') { failing.clear(); renderSim(); }
    if (kind === 'all-fail') { allRuleClasses().forEach(r => failing.add(r)); renderSim(); }
    if (kind === 'copy') {
      navigator.clipboard.writeText(location.href).then(() => { action.textContent = 'Copied!'; });
    }
  }
  panel.addEventListener('click', handleSimulationClick);

  function setSimMode(on) {
    simMode = on;
    simCheckbox.checked = on;
    if (on) {
      renderSim();
    } else {
      clearHighlight();
      showTree(currentTree.name);
      updateUrl();
    }
  }
  simCheckbox.addEventListener('change', evt => setSimMode(evt.target.checked));

  cy.on('tap', 'node', evt => {
    if (simMode) {
      const group = document.getElementById('sim-' + evt.target.id());
      if (group) {
        group.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return;
    }
    clearHighlight(); evt.target.select(); highlightPathsTo(evt.target); showNode(evt.target.id());
  });
  cy.on('tap', evt => { if (evt.target === cy && !simMode) clearHighlight(); });

  treeSelect.addEventListener('change', evt => {
    showTree(evt.target.value);
    if (simMode) renderSim(); else updateUrl();
  });
  document.getElementById('fit').addEventListener('click', () => cy.fit(undefined, 30));
  document.getElementById('reset').addEventListener('click', () => { if (simMode) setSimMode(false); else clearHighlight(); });

  const params = new URLSearchParams(location.hash ? location.hash.substring(1) : location.search);
  const initial = params.get('tree');
  showTree(data.trees.some(t => t.name === initial) ? initial : data.trees[0].name);
  treeSelect.value = currentTree.name;
  (params.get('fail') || '').split(',').filter(Boolean).forEach(r => failing.add(r));
  if (params.get('sim') === '1') setSimMode(true);
</script>
</body>
</html>
