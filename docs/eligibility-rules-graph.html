      id: 'e' + i, source: e.from, target: e.to, label: e.label } })));
    runLayout();
    panelContent.innerHTML = '<p class="muted">' + currentTree.nodes.length + ' nodes, ' +
      currentTree.edges.length + ' edges. Click a node to see its rules, context updaters and outcomes, ' +
      'and to highlight every path from the root to it.</p>';
  }

  const KIND_NAMES = { RULE_SET: 'Rule Set', CONTEXT_UPDATER: 'Context Updater', OUTCOME: 'Outcome' };
  const nodeLink = n => sourceTextLink(n.title, n.sourcePath);
  const nodeById = id => currentTree.nodes.find(x => x.id === id);

  function outcomePreviewHtml(outcome, reasons, inTrace = false) {
    const meta = data.statuses[outcome.status];
    if (!meta) return '<p>Card preview unavailable for status ' + esc(outcome.status) + '.</p>';

    const unavailable = () => {
      const serviceName = orderedTrees.find(tree => tree.name === meta.service)?.fullName || meta.service;
      const heading = inTrace ? '<h3>' + esc(meta.text) + '</h3><h4>Cards</h4>' : '';
      return heading + '<p>' + esc(serviceName) + ': <b>' + esc(meta.text) +
        '</b>. The UI has no corresponding eligibility card.</p>' + outcomeActionHtml(outcome, meta);
    };

    let preview;
    try {
      preview = statusCardPreview(outcome, reasons);
    } catch (error) {
      if (error.message === 'Unsupported UI status: ' + outcome.status ||
          error.message === 'No eligibility card for service: ' + meta.service) return unavailable();
      throw error;
    }

    const template = document.createElement('template');
    template.innerHTML = preview || '';
    const heading = template.content.querySelector('.sas-card__head h3');
    // Older UI exports can render a card with an empty heading for an unsupported service.
    if (!preview?.trim() || (heading && !heading.textContent.trim())) return unavailable();

    return preview + outcomeActionHtml(outcome, meta);
  }

  function outcomeActionHtml(outcome, meta) {
    try {
      return statusActionPreview(outcome);
    } catch (error) {
      if (error.message === 'Missing UI action label: ' + meta.actionType) {
        return '<p class="card-action"><b>Action:</b> Not implemented in the UI.</p>';
      }
      throw error;
    }
  }

  const cardHtml = (outcome, reasons) => '<div class="trace-outcomes"><div class="result">' +
    outcomePreviewHtml(outcome, reasons) + '</div></div>';
  const ruleLink = r => sourceTextLink(r.description, r.sourcePath);
  const updaterFor = route => route.label === 'PASS' ? route.ruleSet.onPass : route.ruleSet.onFail;
  const routeCause = (route, rule) => nodeLink(route.ruleSet) + ' ' + badge(route.label) + (rule ? ' – ' + ruleLink(rule) : '');

  // Shows each distinct card once, listing every route (and rule) that leads to it above the card.
  function distinctCardsHtml(entries) {
    const groups = new Map();
    entries.forEach(({ html, cause }) => {
      const group = groups.get(html) || groups.set(html, { causes: new Set() }).get(html);
      group.causes.add(cause);
    });
    return [...groups].map(([html, g]) =>
      '<div class="route"><ul>' + [...g.causes].map(c => '<li>' + c + '</li>').join('') + '</ul>' + html + '</div>').join('');
  }

  // The rule sets (and the PASS/FAIL branch) that lead to a node, looking through context updater nodes.
  function routesInto(id) {
    return currentTree.edges.filter(e => e.to === id).flatMap(e => {
      const source = nodeById(e.from);
      return source.kind === 'CONTEXT_UPDATER' ? routesInto(source.id) : [{ ruleSet: source, label: e.label }];
    });
  }

  function reasonText(reason) {
    const rules = [...new Map(currentTree.nodes.flatMap(n => n.rules)
      .filter(r => r.failureReason === reason).map(r => [r.className, r])).values()];
    return rules.length ? rules.map(ruleLink).join(' or ') : esc(reason);
  }

  const updaterOutcomeHtml = o =>
    (o.failureReasons.length ? '<p>When ' + o.failureReasons.map(reasonText).join(' and ') + '</p>' : '') + cardHtml(o, []);

  // The distinct cards set by the context updaters on the routes into a node.
  function updaterCardsHtml(routes) {
    return distinctCardsHtml(routes.flatMap(route => (updaterFor(route)?.outcomes || []).map(o =>
      ({ html: updaterOutcomeHtml(o), cause: routeCause(route) }))));
  }

  // Each distinct card a context updater node can set, shown once however many routes lead to it.
  function distinctUpdaterCardsHtml(routes) {
    const outcomes = new Map();
    routes.forEach(route => (updaterFor(route)?.outcomes || []).forEach(o =>
      outcomes.set(JSON.stringify([o.status, o.failureReasons]), o)));
    return [...outcomes.values()].map(updaterOutcomeHtml).join('');
  }

  function outcomeCardsHtml(n) {
    const routes = routesInto(n.id);
    if (data.statuses[n.id]) {
      const outcome = { status: n.id };
      const failureRoutes = routes.filter(r =>
        r.label === 'FAIL' && r.ruleSet.rules.some(rule => rule.failureReason));
      if (!failureRoutes.length || !n.id.endsWith('_NOT_ELIGIBLE')) return cardHtml(outcome, []);

      const ruleSetGroups = new Map();
      failureRoutes.forEach(route => {
        const rulesWithFailureReasons = route.ruleSet.rules.filter(rule => rule.failureReason);
        const combinations = rulesWithFailureReasons.reduce(
          (subsets, rule) => subsets.concat(subsets.map(subset => [...subset, rule])),
          [[]]);
        const cards = new Map();
        combinations.slice(1).forEach(rules => {
          const failureReasons = [...new Set(rules.map(rule => rule.failureReason))].sort();
          const renderedCard = cardHtml(outcome, failureReasons);
          const card = cards.get(renderedCard) || { renderedCard, conditions: new Map() };
          card.conditions.set(JSON.stringify(rules.map(rule => rule.className).sort()), rules);
          cards.set(renderedCard, card);
        });

        const cardList = [...cards.keys()].sort();
        const key = JSON.stringify(cardList);
        const group = ruleSetGroups.get(key) || {
          cards: new Map(cardList.map(renderedCard => [renderedCard, { renderedCard, conditions: new Map() }])),
          ruleSets: new Map(),
        };
        group.ruleSets.set(route.ruleSet.id, route.ruleSet);
        cards.forEach((card, renderedCard) => {
          const groupedCard = group.cards.get(renderedCard);
          card.conditions.forEach((rules, condition) =>
            groupedCard.conditions.set(route.ruleSet.id + ':' + condition, { ruleSet: route.ruleSet, rules }));
        });
        ruleSetGroups.set(key, group);
      });

      return [...ruleSetGroups.values()].map(({ cards, ruleSets }) => {
        const sets = [...ruleSets.values()];
        const heading = sets.length === 1 ? 'Shown when this rule set fails:' : 'Shown when these rule sets fail:';
        const conditions = sets.map(node => '<li>' + nodeLink(node) + '</li>').join('');
        const cardsHtml = [...cards.values()].map(({ renderedCard, conditions: cardConditions }) => {
          const triggers = [...cardConditions.values()].map(({ ruleSet, rules }) =>
            '<li>' + nodeLink(ruleSet) + ': ' + rules.map(ruleLink).join(' and ') + '</li>').join('');
          return '<div class="route"><p>Shown when these rules fail:</p><ul>' + triggers + '</ul>' +
            renderedCard + '</div>';
        }).join('');
        return '<div class="route"><p>' + heading + '</p><ul>' + conditions + '</ul>' + cardsHtml + '</div>';
      }).join('');
    }
    const updaterCards = updaterCardsHtml(routes);
    if (updaterCards) return updaterCards;
    const earlier = new Map();
    cy.getElementById(n.id).predecessors('edge').forEach(e => {
      const source = nodeById(e.source().id());
      if (source.kind !== 'RULE_SET') return;
      (updaterFor({ ruleSet: source, label: e.data('label') })?.outcomes || []).forEach(o => earlier.set(o.status, o));
    });
    if (!earlier.size) return '<p class="muted">Keeps the status from earlier in the tree; no status is set on the way here.</p>';
    return '<p class="muted">Keeps the status set earlier in the tree, so it could be any of these:</p>' +
      [...earlier.values()].map(o => cardHtml(o, [])).join('');
  }
  function showNode(id) {
    const n = nodeById(id);
    let html = '<p class="muted kind">' + esc(KIND_NAMES[n.kind] || n.kind) + '</p><h2>' + nodeLink(n) + '</h2>';
    if (n.kind === 'RULE_SET') {
      html += '<h3>Rules</h3>';
      html += n.rules.length === 0 ? '<p>(no rules – always PASS)</p>' :
        '<ul>' + n.rules.map(r => '<li>' + sourceTextLink(r.description, r.sourcePath) + '</li>').join('') + '</ul>';
    }
    if (n.kind === 'OUTCOME') html += '<h3>Cards</h3>' + outcomeCardsHtml(n);
    if (n.kind === 'CONTEXT_UPDATER') {
      const updaterCards = distinctUpdaterCardsHtml(routesInto(n.id));
      if (updaterCards) html += '<h3>Cards</h3>' + updaterCards;
    }
    const node = cy.getElementById(id);
    const inc = node.incomers('edge').map(e => nodeLink(nodeById(e.source().id())));
    const out = node.outgoers('edge').map(e => '<b>' + esc(e.data('label')) + '</b> → ' + nodeLink(nodeById(e.target().id())));
    if (inc.length) html += '<h3>Reached from</h3><ul>' + inc.map(s => '<li>' + s + '</li>').join('') + '</ul>';
    if (out.length) html += '<h3>Leads to</h3><ul>' + out.map(s => '<li>' + s + '</li>').join('') + '</ul>';
    panelContent.innerHTML = html;
  }

  function highlightPathsTo(node) {
    const path = node.predecessors().union(node);
    cy.elements().addClass('faded');
    path.removeClass('faded');
  }

  function clearHighlight() {
    cy.elements().removeClass('faded onpath sim-pass sim-fail');
    cy.$(':selected').unselect();
  }

  // ---------- Simulation ----------
  // Mirrors RuleSetNode.eval / RulesEngine.execute: a RuleSet PASSes only if none of its rules FAIL,
  // then follows the PASS/FAIL edge (via its context updater, if any) until an outcome is reached.
  // Rule results are keyed by rule class, so a rule shared by several RuleSets has a single result.
  const simCheckbox = document.getElementById('simulate');
  const failing = new Set();
  let simMode = false;

  function simulate() {
    const byId = new Map(currentTree.nodes.map(n => [n.id, n]));
    const outEdges = id => currentTree.edges.filter(e => e.from === id);
    const incoming = new Set(currentTree.edges.map(e => e.to));
    const root = currentTree.nodes.find(n => !incoming.has(n.id)) || currentTree.nodes[0];
    const steps = [];
    const pathEdges = [];
    let id = root.id;
    let lastUpdater = null;
    let guard = 0;
    while (id && guard++ < 200) {
      const n = byId.get(id);
      let edge;
      if (n.kind === 'RULE_SET') {
        const failed = n.rules.filter(r => failing.has(r.className));
        const status = failed.length ? 'FAIL' : 'PASS';
        steps.push({ node: n, status: status, failed: failed });
        const updater = status === 'PASS' ? n.onPass : n.onFail;
        if (updater) lastUpdater = updater;
        edge = outEdges(id).find(e => e.label === status);
      } else if (n.kind === 'CONTEXT_UPDATER') {
        steps.push({ node: n });
        edge = outEdges(id).find(e => e.label === 'CONTINUE');
      } else {
        steps.push({ node: n });
        break;
      }
      if (!edge) break;
      pathEdges.push(edge);
      id = edge.to;
    }
    return { steps: steps, pathEdges: pathEdges, lastUpdater: lastUpdater };
  }

  function badge(status) {
    if (!status) return '<span class="badge na">not reached</span>';
    return '<span class="badge ' + status.toLowerCase() + '">' + status + '</span>';
  }

  // Updaters whose outcomes all declare failure reasons resolve to the outcome matching the reasons of the rules failed on the path.
  function resolveOutcomes(res) {
    const last = res.steps[res.steps.length - 1];
    if (data.statuses[last.node.id]) return [{ status: last.node.id }];
    const outcomes = res.lastUpdater?.outcomes || [];
    if (outcomes.length < 2 || !outcomes.every(o => o.failureReasons.length)) return outcomes;
    const selectable = new Set(outcomes.flatMap(o => o.failureReasons));
    const failed = new Set(res.steps.flatMap(s => s.failed || []).map(r => r.failureReason).filter(r => selectable.has(r)));
    const matches = outcomes.filter(o => o.failureReasons.length === failed.size && o.failureReasons.every(r => failed.has(r)));
    return matches.length === 1 ? matches : outcomes;
  }

  function resultHtml(res) {
    const last = res.steps[res.steps.length - 1];
    if (!last || last.node.kind !== 'OUTCOME') return '<div class="result">No outcome reached</div>';
    const outcomes = resolveOutcomes(res);
    let html = '<div class="result">';
    if (!outcomes.length) return html + '<p>No status was set, so a card cannot be previewed.</p></div>';
    if (outcomes.length > 1) {
      html;
    }
    const previousRuleSet = res.steps.filter(s => s.node.kind === 'RULE_SET').pop();
    const reasons = (previousRuleSet?.failed || []).map(r => r.failureReason).filter(Boolean);
    return html + outcomes.map(o => outcomePreviewHtml(o, reasons, true)).join('') + '</div>';
  }

  function failureDescription(rules) {
    return 'Failed because ' + rules.map(rule => rule.description.replace(/^FAIL if\s+/i, '')).join('; ');
  }

  function traceStepHtml(step, res) {
    if (step.node.kind === 'RULE_SET') {
      if (step.failed.length) return step.failed.map(rule =>
        '<li>' + sourceTextLink(failureDescription([rule]), rule.sourcePath) + ' ' + badge('FAIL') + '</li>').join('');
      const description = 'Passed because ' + step.node.title.replace(/^PASS if\s+/i, '');
      return '<li>' + sourceTextLink(description, step.node.sourcePath) + ' ' + badge('PASS') + '</li>';
    }
    if (step.node.kind === 'CONTEXT_UPDATER') {
      const updater = res.steps.filter(s => s.node.kind === 'RULE_SET')
        .map(s => s.status === 'PASS' ? s.node.onPass : s.node.onFail)
        .find(u => u?.description === step.node.title);
      let description = esc(step.node.title);
      if (updater) {
        const statuses = [...new Map(updater.outcomes.map(o => [data.statuses[o.status]?.text, o])).entries()]
          .filter(([text]) => text).sort((a, b) => b[0].length - a[0].length);
        const labels = new Map(statuses.map(([text, outcome]) => [esc(text), statusCardTag(outcome)]));
        if (labels.size) {
          const pattern = [...labels.keys()].map(text => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
          description = description.replace(new RegExp(pattern, 'g'), match => labels.get(match));
        }
      }
      return '<li class="trace-update">' + description + ' ' + badge('UPDATE') + '</li>';
    }
    const outcomeCount = resolveOutcomes(res).length;
    return '<li><div class="trace-outcomes"><b>' + (outcomeCount > 1 ? 'Outcomes' : 'Outcome') + '</b>' +
      resultHtml(res) + '</div></li>';
  }

  function renderSim() {
    const res = simulate();
    const statusById = new Map(res.steps.filter(s => s.status).map(s => [s.node.id, s.status]));

    cy.elements().removeClass('faded onpath sim-pass sim-fail');
    cy.$(':selected').unselect();
    cy.elements().addClass('faded');
    res.steps.forEach(s => cy.getElementById(s.node.id).removeClass('faded').addClass('onpath'));
    res.pathEdges.forEach(e => cy.getElementById('e' + currentTree.edges.indexOf(e)).removeClass('faded').addClass('onpath'));
    statusById.forEach((status, nodeId) => cy.getElementById(nodeId).addClass(status === 'PASS' ? 'sim-pass' : 'sim-fail'));

    let html = '<div class="simulation-actions"><button data-sim="all-pass">All PASS</button>' +
      '<button data-sim="all-fail">All FAIL</button><button data-sim="copy">Copy link</button></div>' +
      '<h2>Trace</h2><ol class="trace">' +
      res.steps.map(s => traceStepHtml(s, res)).join('') + '</ol>' +
      '<h2>Rules</h2>';

    currentTree.nodes.filter(n => n.kind === 'RULE_SET').forEach(n => {
      const status = statusById.get(n.id);
      html += '<div class="sim-group ' + (status ? 'visited' : 'skipped') + '" id="sim-' + esc(n.id) + '">' +
        '<h4><span>' + sourceTextLink(n.title, n.sourcePath) + '</span>' + badge(status) + '</h4>';
      if (n.rules.length === 0) html += '<div class="muted" style="font-size:12px">(no rules – always PASS)</div>';
      n.rules.forEach(r => {
        const fail = failing.has(r.className);
        html += '<div class="sim-rule"><button class="' + (fail ? 'fail' : 'pass') + '" data-rule="' + esc(r.className) + '">' +
          (fail ? 'FAIL' : 'PASS') + '</button><span>' +
          (r.sourcePath ? '<a href="' + esc(r.sourcePath) + '" target="_blank" rel="noopener noreferrer">' +
            esc(r.description) + '</a>' : esc(r.description)) + '</span></div>';
      });
      html += '</div>';
    });
    panelContent.innerHTML = html;
    updateUrl();
  }

  function allRuleClasses() {
    return [...new Set(currentTree.nodes.flatMap(n => n.rules.map(r => r.className)))];
  }

  function updateUrl() {
    const params = new URLSearchParams();
    params.set('tree', currentTree.name);
    if (simMode) params.set('sim', '1');
    if (failing.size) params.set('fail', [...failing].sort().join(','));
    history.replaceState(null, '', location.pathname + '#' + params.toString());
  }

  function handleSimulationClick(evt) {
    const ruleBtn = evt.target.closest('[data-rule]');
    if (ruleBtn) {
      const rule = ruleBtn.getAttribute('data-rule');
      if (failing.has(rule)) failing.delete(rule); else failing.add(rule);
      renderSim();
      return;
    }
    const action = evt.target.closest('[data-sim]');
    if (!action) return;
    evt.preventDefault();
    const kind = action.getAttribute('data-sim');
    if (kind === 'all-pass') { failing.clear(); renderSim(); }
    if (kind === 'all-fail') { allRuleClasses().forEach(r => failing.add(r)); renderSim(); }
    if (kind === 'copy') {
      navigator.clipboard.writeText(location.href).then(() => { action.textContent = 'Copied!'; });
    }
  }
  panel.addEventListener('click', handleSimulationClick);

  function setSimMode(on) {
    simMode = on;
    simCheckbox.checked = on;
    if (on) {
      renderSim();
    } else {
      clearHighlight();
      showTree(currentTree.name);
      updateUrl();
    }
  }
  simCheckbox.addEventListener('change', evt => setSimMode(evt.target.checked));

  cy.on('tap', 'node', evt => {
    if (simMode) {
      const group = document.getElementById('sim-' + evt.target.id());
      if (group) {
        group.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return;
    }
    clearHighlight(); evt.target.select(); highlightPathsTo(evt.target); showNode(evt.target.id());
  });
  cy.on('tap', evt => { if (evt.target === cy && !simMode) clearHighlight(); });

  document.getElementById('fit').addEventListener('click', () => cy.fit(undefined, 30));
  document.getElementById('reset').addEventListener('click', () => { if (simMode) setSimMode(false); else clearHighlight(); });
  togglePanelButton.addEventListener('click', () => {
    const expanded = panel.classList.toggle('expanded');
    togglePanelButton.setAttribute('aria-expanded', String(expanded));
    togglePanelButton.textContent = expanded ? 'Narrow panel' : 'Expand panel';
  });

  function openTree(name) {
    document.body.classList.remove('home');
    cy.resize();
    failing.clear();
    simMode = false;
    simCheckbox.checked = false;
    clearHighlight();
    showTree(name);
    const tree = data.trees.find(t => t.name === name);
    treeHeading.innerHTML = '<h1>' + esc(name) + (tree.fullName ? ' – ' + esc(tree.fullName) : '') + '</h1>' +
      (tree.description ? '<p class="muted">' + esc(tree.description) + '</p>' : '');
    treeSelect.value = name;
    document.title = name + (tree.fullName ? ' – ' + tree.fullName : '') + ' – Eligibility rules graph';
    updateUrl();
  }

  function goHome() {
    simMode = false;
    simCheckbox.checked = false;
    failing.clear();
    document.body.classList.add('home');
    treeSelect.value = '';
    document.title = 'Eligibility rules graphs';
    history.replaceState(null, '', location.pathname);
  }

  document.getElementById('tree-cards').innerHTML = orderedTrees.map(t => {
    return '<button class="tree-card" data-tree="' + esc(t.name) + '"><h2>' + esc(t.name) + '</h2>' +
      '<p class="full-name">' + esc(t.fullName) + '</p><p>' + esc(t.description) + '</p>' +
      '<p class="muted">' + t.nodes.filter(n => n.kind === 'RULE_SET').length + ' rule sets, ' +
      t.nodes.filter(n => n.kind === 'OUTCOME').length + ' outcomes</p></button>';
  }).join('');
  document.getElementById('tree-cards').addEventListener('click', evt => {
    const card = evt.target.closest('[data-tree]');
    if (card) openTree(card.getAttribute('data-tree'));
  });
  treeSelect.add(new Option('← All trees (home page)', ''));
  orderedTrees.forEach(t => treeSelect.add(new Option(t.name + (t.fullName ? ' – ' + t.fullName : ''), t.name)));
  treeSelect.addEventListener('change', evt => {
    if (evt.target.value) openTree(evt.target.value); else goHome();
  });

  const params = new URLSearchParams(location.hash ? location.hash.substring(1) : location.search);
  const initial = params.get('tree');
  if (data.trees.some(t => t.name === initial)) {
    openTree(initial);
    (params.get('fail') || '').split(',').filter(Boolean).forEach(r => failing.add(r));
    if (params.get('sim') === '1') setSimMode(true); else updateUrl();
  } else {
    goHome();
  }
</script>
</body>
</html>
