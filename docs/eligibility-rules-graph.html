      font-size: 13px;
      display: flex;
      justify-content: space-between;

    .sim-rule {

      font-size: 12px;

      color: #a02a1e;

      color: #1e6b1e;

      background: #f8d7d3;
      color: #a02a1e;

    .badge.na {

<script>
  const data = JSON.parse(document.getElementById('graph-data').textContent);
  const treeSelect = document.getElementById('tree');
  const panel = document.getElementById('panel');
  data.trees.forEach(t => treeSelect.add(new Option(t.name, t.name)));

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
  const codeLink = (name, path) => path ? '<a href="' + esc(path) + '" target="_blank"><code>' + esc(name) + '</code></a>' : '<code>' + esc(name) + '</code>';

  function label(n) {
    return n.label;
  }

  function searchText(n) {
    const parts = [n.title, n.kind];
    n.rules.forEach(r => parts.push(r.className, r.description));
    [n.onPass, n.onFail].filter(Boolean).forEach(u => {
      parts.push(u.name, u.description);
      u.outcomes.forEach(o => parts.push(o.status, o.action, o.linkType, o.blockingReason));
    });
    return parts.filter(Boolean).join(' ').toLowerCase();
  }

  const cy = cytoscape({
    container: document.getElementById('cy'),
    wheelSensitivity: 0.3,
    style: [
      {
        selector: 'node', style: {
          'label': 'data(label)', 'text-wrap': 'wrap', 'text-max-width': 360, 'font-size': 12,
          'text-valign': 'center', 'text-halign': 'center', 'width': 380, 'height': 'label', 'padding': 12,
          'shape': 'round-rectangle', 'border-width': 2
        }
      },
      {
        selector: 'node[kind = "RULE_SET"]',
        style: {'background-color': '#dbe9ff', 'border-color': '#3b73c4', 'text-justification': 'left'}
      },
      {
        selector: 'node[kind = "CONTEXT_UPDATER"]',
        style: {'background-color': '#fff2cc', 'border-color': '#c99a00', 'font-size': 11}
      },
      {selector: 'node[kind = "OUTCOME"]', style: {'background-color': '#d9f2d9', 'border-color': '#2e8b2e'}},
      {
        selector: 'edge', style: {
          'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'width': 2, 'label': 'data(label)',
          'font-size': 10, 'text-background-color': '#fff', 'text-background-opacity': 1, 'text-background-padding': 2
        }
      },
      {
        selector: 'edge[label = "PASS"]',
        style: {'line-color': '#2e8b2e', 'target-arrow-color': '#2e8b2e', 'color': '#2e8b2e'}
      },
      {
        selector: 'edge[label = "FAIL"]',
        style: {'line-color': '#c0392b', 'target-arrow-color': '#c0392b', 'color': '#c0392b'}
      },
      {selector: '.faded', style: {'opacity': 0.15}},
      {selector: '.match', style: {'border-width': 5, 'border-color': '#8e44ad'}},
      {selector: 'node:selected', style: {'border-width': 5, 'border-color': '#000'}},
      {selector: 'node.onpath', style: {'border-width': 6, 'border-color': '#8e44ad'}},
      {selector: 'edge.onpath', style: {'width': 6, 'z-index': 10}},
      {selector: 'node.sim-fail', style: {'background-color': '#f8d7d3'}},
      {selector: 'node.sim-pass', style: {'background-color': '#c8ecc8'}},
    ],
  });

  let currentTree;

  function runLayout() {
    cy.layout({
      name: 'dagre',
      rankDir: document.getElementById('layout').value,
      nodeSep: 40,
      rankSep: 70,
      edgeSep: 20
    }).run();
    cy.fit(undefined, 30);
  }

  function showTree(name) {
    currentTree = data.trees.find(t => t.name === name);
    cy.elements().remove();
    cy.add(currentTree.nodes.map(n => ({
      group: 'nodes', data: {
        id: n.id, label: label(n), title: n.title, kind: n.kind, search: searchText(n)
      }
    })));
    cy.add(currentTree.edges.map((e, i) => ({
      group: 'edges', data: {
        id: 'e' + i, source: e.from, target: e.to, label: e.label
      }
    })));
    runLayout();
    panel.innerHTML = '<h2>' + esc(name) + '</h2><p class="muted">' + currentTree.nodes.length + ' nodes, ' +
      currentTree.edges.length + ' edges. Click a node for details.</p>';
    document.getElementById('search').value = '';
  }

  function outcomesTable(outcomes) {
    if (!outcomes.length) return '';
    const blocking = outcomes.some(o => o.blockingReason);
    let html = '<table><tr><th>Status</th><th>Action</th><th>Link type</th>' + (blocking ? '<th>Blocking reason</th>' : '') + '</tr>';
    outcomes.forEach(o => {
      html += '<tr><td>' + esc(o.status) + '</td><td>' + esc(o.action || '-') + '</td><td>' + esc(o.linkType || '-') + '</td>' +
        (blocking ? '<td>' + esc(o.blockingReason || '-') + '</td>' : '') + '</tr>';
    });
    return html + '</table>';
  }

  function updaterHtml(title, u) {
    if (!u) return '';
    const name = u.name === 'constant' ? '' : codeLink(u.name, u.sourcePath) + ' – ';
    return '<h3>' + title + ' context updater</h3><p>' + name + esc(u.description) + '</p>' + outcomesTable(u.outcomes);
  }

  function showNode(id) {
    const n = currentTree.nodes.find(x => x.id === id);
    let html = '<h2>' + esc(n.title) + '</h2><p class="muted">' + esc(n.kind) + '</p>';
    if (n.kind === 'RULE_SET') {
      html += '<h3>Rules</h3>';
      html += n.rules.length === 0 ? '<p>(no rules – always PASS)</p>' :
        '<ul>' + n.rules.map(r => '<li>' + codeLink(r.className, r.sourcePath) + '<br>' + esc(r.description) + '</li>').join('') + '</ul>';
      html += updaterHtml('PASS', n.onPass) + updaterHtml('FAIL', n.onFail);
    }
    const node = cy.getElementById(id);
    const inc = node.incomers('edge').map(e => esc(e.source().data('title')) + ' <b>' + esc(e.data('label')) + '</b>');
    const out = node.outgoers('edge').map(e => '<b>' + esc(e.data('label')) + '</b> → ' + esc(e.target().data('title')));
    if (inc.length) html += '<h3>Reached from</h3><ul>' + inc.map(s => '<li>' + s + '</li>').join('') + '</ul>';
    if (out.length) html += '<h3>Leads to</h3><ul>' + out.map(s => '<li>' + s + '</li>').join('') + '</ul>';
    panel.innerHTML = html;
  }

  function highlightPathsTo(node) {
    const path = node.predecessors().union(node);
    cy.elements().addClass('faded');
    path.removeClass('faded');
  }

  function clearHighlight() {
    cy.elements().removeClass('faded match onpath sim-pass sim-fail');
    cy.$(':selected').unselect();
  }

  // ---------- Simulation ----------
  // Mirrors RuleSetNode.eval / RulesEngine.execute: a RuleSet PASSes only if none of its rules FAIL,
  // then follows the PASS/FAIL edge (via its context updater, if any) until an outcome is reached.
  // Rule results are keyed by rule class, so a rule shared by several RuleSets has a single result.
  const simCheckbox = document.getElementById('simulate');
  const failing = new Set();
  let simMode = false;

  function simulate() {
    const byId = new Map(currentTree.nodes.map(n => [n.id, n]));
    const outEdges = id => currentTree.edges.filter(e => e.from === id);
    const incoming = new Set(currentTree.edges.map(e => e.to));
    const root = currentTree.nodes.find(n => !incoming.has(n.id)) || currentTree.nodes[0];
    const steps = [];
    const pathEdges = [];
    let id = root.id;
    let via = null;
    let lastUpdater = null;
    let guard = 0;
    while (id && guard++ < 200) {
      const n = byId.get(id);
      let edge;
      if (n.kind === 'RULE_SET') {
        const failed = n.rules.filter(r => failing.has(r.className));
        const status = failed.length ? 'FAIL' : 'PASS';
        steps.push({node: n, status: status, failed: failed});
        const updater = status === 'PASS' ? n.onPass : n.onFail;
        if (updater) lastUpdater = updater;
        via = status;
        edge = outEdges(id).find(e => e.label === status);
      } else if (n.kind === 'CONTEXT_UPDATER') {
        steps.push({node: n});
        const outs = outEdges(id);
        edge = outs.find(e => e.label === via) || outs[0];
      } else {
        steps.push({node: n});
        break;
      }
      if (!edge) break;
      pathEdges.push(edge);
      id = edge.to;
    }
    return {steps: steps, pathEdges: pathEdges, lastUpdater: lastUpdater};
  }

  function badge(status) {
    if (!status) return '<span class="badge na">not reached</span>';
    return '<span class="badge ' + status.toLowerCase() + '">' + status + '</span>';
  }

  function resultHtml(res) {
    const last = res.steps[res.steps.length - 1];
    if (!last || last.node.kind !== 'OUTCOME') return '<div class="result">No outcome reached</div>';
    let html = '<div class="result"><b>Outcome:</b> ' + esc(last.node.title);
    const updater = res.lastUpdater;
    // outcome produced by a terminal context updater: show the statuses it can set
    if (updater && updater.description === last.node.title) {
      if (updater.outcomes.length > 1) {
        html += '<br><span class="muted">One of the following; which one depends on data the simulator does not model.</span>';
      }
      return html + outcomesTable(updater.outcomes) + '</div>';
    }
    if (/current status/i.test(last.node.title)) {
      if (res.lastUpdater && res.lastUpdater.outcomes.length) {
        html += '<br><b>Status set by</b> ' + esc(res.lastUpdater.name === 'constant' ? res.lastUpdater.description : res.lastUpdater.name);
        if (res.lastUpdater.outcomes.length > 1) {
          html += '<br><span class="muted">One of the following; which one depends on data the simulator does not model.</span>';
        }
        html += outcomesTable(res.lastUpdater.outcomes);
      } else {
        html += '<br><span class="muted">No context updater ran, so the status is the initial status from the context.</span>';
      }
    }
    return html + '</div>';
  }

  function renderSim() {
    const res = simulate();
    const statusById = new Map(res.steps.filter(s => s.status).map(s => [s.node.id, s.status]));

    cy.elements().removeClass('faded match onpath sim-pass sim-fail');
    cy.$(':selected').unselect();
    cy.elements().addClass('faded');
    res.steps.forEach(s => cy.getElementById(s.node.id).removeClass('faded').addClass('onpath'));
    res.pathEdges.forEach(e => cy.getElementById('e' + currentTree.edges.indexOf(e)).removeClass('faded').addClass('onpath'));
    statusById.forEach((status, nodeId) => cy.getElementById(nodeId).addClass(status === 'PASS' ? 'sim-pass' : 'sim-fail'));

    let html = '<h2>Simulate ' + esc(currentTree.name) + '</h2>' +
      '<p class="muted">Set each rule to PASS or FAIL. The highlighted path shows where the result goes.</p>' +
      '<p><button data-sim="all-pass">All PASS</button> <button data-sim="all-fail">All FAIL</button> ' +
      '<button data-sim="copy">Copy link</button></p>' +
      resultHtml(res) +
      '<h3>Trace</h3><ol class="trace">' + res.steps.map(s => {
        if (s.node.kind === 'RULE_SET') {
          const why = s.failed.length ? ' – failed: ' + s.failed.map(r => '<code>' + esc(r.className) + '</code>').join(', ') : '';
          return '<li><b>' + esc(s.node.title) + '</b> ' + badge(s.status) + why + '</li>';
        }
        if (s.node.kind === 'CONTEXT_UPDATER') return '<li><span class="muted">update:</span> ' + esc(s.node.title) + '</li>';
        return '<li><span class="muted">outcome:</span> <b>' + esc(s.node.title) + '</b></li>';
      }).join('') + '</ol>' +
      '<h3>Rule inputs</h3>';

    currentTree.nodes.filter(n => n.kind === 'RULE_SET').forEach(n => {
      const status = statusById.get(n.id);
      html += '<div class="sim-group ' + (status ? 'visited' : 'skipped') + '" id="sim-' + esc(n.id) + '">' +
        '<h4><span>' + esc(n.title) + '</span>' + badge(status) + '</h4>';
      if (n.rules.length === 0) html += '<div class="muted" style="font-size:12px">(no rules – always PASS)</div>';
      n.rules.forEach(r => {
        const fail = failing.has(r.className);
        html += '<div class="sim-rule"><button class="' + (fail ? 'fail' : 'pass') + '" data-rule="' + esc(r.className) + '">' +
          (fail ? 'FAIL' : 'PASS') + '</button><span><code>' + esc(r.className) + '</code><br>' + esc(r.description) + '</span></div>';
      });
      html += '</div>';
    });
    panel.innerHTML = html;
    updateUrl();
  }

  function allRuleClasses() {
    return [...new Set(currentTree.nodes.flatMap(n => n.rules.map(r => r.className)))];
  }

  function updateUrl() {
    const params = new URLSearchParams();
    params.set('tree', currentTree.name);
    if (simMode) params.set('sim', '1');
    if (failing.size) params.set('fail', [...failing].sort().join(','));
    history.replaceState(null, '', location.pathname + '#' + params.toString());
  }

  panel.addEventListener('click', evt => {
    const ruleBtn = evt.target.closest('[data-rule]');
    if (ruleBtn) {
      const rule = ruleBtn.getAttribute('data-rule');
      if (failing.has(rule)) failing.delete(rule); else failing.add(rule);
      renderSim();
      return;
    }
    const action = evt.target.closest('[data-sim]');
    if (!action) return;
    const kind = action.getAttribute('data-sim');
    if (kind === 'all-pass') {
      failing.clear();
      renderSim();
    }
    if (kind === 'all-fail') {
      allRuleClasses().forEach(r => failing.add(r));
      renderSim();
    }
    if (kind === 'copy') {
      navigator.clipboard.writeText(location.href).then(() => {
        action.textContent = 'Copied!';
      });
    }
  });

  function setSimMode(on) {
    simMode = on;
    simCheckbox.checked = on;
    if (on) {
      renderSim();
    } else {
      clearHighlight();
      showTree(currentTree.name);
      updateUrl();
    }
  }

  simCheckbox.addEventListener('change', evt => setSimMode(evt.target.checked));

  cy.on('tap', 'node', evt => {
    if (simMode) {
      const group = document.getElementById('sim-' + evt.target.id());
      if (group) group.scrollIntoView({behavior: 'smooth', block: 'center'});
      return;
    }
    clearHighlight();
    evt.target.select();
    highlightPathsTo(evt.target);
    showNode(evt.target.id());
  });
  cy.on('tap', evt => {
    if (evt.target === cy && !simMode) clearHighlight();
  });

  document.getElementById('search').addEventListener('input', evt => {
    if (simMode) return;
    const q = evt.target.value.trim().toLowerCase();
    cy.elements().removeClass('faded match');
    if (!q) return;
    const matches = cy.nodes().filter(n => n.data('search').includes(q));
    cy.elements().addClass('faded');
    matches.removeClass('faded').addClass('match');
  });
  treeSelect.addEventListener('change', evt => {
    showTree(evt.target.value);
    if (simMode) renderSim(); else updateUrl();
  });
  document.getElementById('layout').addEventListener('change', runLayout);
  document.getElementById('fit').addEventListener('click', () => cy.fit(undefined, 30));
  document.getElementById('reset').addEventListener('click', () => {
    if (simMode) setSimMode(false); else clearHighlight();
  });

  const params = new URLSearchParams(location.hash ? location.hash.substring(1) : location.search);
  const initial = params.get('tree');
  showTree(data.trees.some(t => t.name === initial) ? initial : data.trees[0].name);
  treeSelect.value = currentTree.name;
  (params.get('fail') || '').split(',').filter(Boolean).forEach(r => failing.add(r));
  if (params.get('sim') === '1') setSimMode(true);
</script>
</body>
</html>
